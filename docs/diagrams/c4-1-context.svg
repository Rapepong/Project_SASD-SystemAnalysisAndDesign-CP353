<text x="595.0" y="260.0" font-size="12" font-weight="normal" fill="#ffffff" text-anchor="middle" font-style="normal">[Software System]</text>
<text x="595.0" y="288.0" font-size="12.5" font-weight="normal" fill="#ffffff" text-anchor="middle" font-style="normal">ร้านขายเกมออนไลน์: ค้นหาเกม</text>
